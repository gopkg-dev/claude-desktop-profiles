name: NSGo update check

# NSGo has no tagged releases, so Dependabot can't follow it. Once a week this compares the
# pinned NSGo commit with NSGo's main branch. When main is newer, it tries the upgrade
# (build, vet and the signing adapter's tests, whose patch matches NSGo's source exactly)
# and opens or updates one issue with the result. Nothing is committed.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: nsgo-update
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  MODULE: github.com/nsgo-dev/nsgo
  ISSUE_TITLE: NSGo update available

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compare the pinned version with NSGo main
        id: versions
        run: |
          current="$(go list -m -f '{{.Version}}' "$MODULE")"
          latest="$(GOFLAGS=-mod=mod go list -m -f '{{.Version}}' "$MODULE@main")"
          echo "pinned $current, main $latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          # Pseudo-versions end in the commit hash; the timestamp before it orders them.
          if [ "$current" = "$latest" ] || [[ "$latest" < "$current" ]]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Try the upgrade
        id: trial
        if: steps.versions.outputs.newer == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          run() {
            if out="$("$@" 2>&1)"; then
              printf -- '- ✅ `%s`\n' "$*" >> "$RUNNER_TEMP/results.md"
            else
              printf -- '- ❌ `%s`\n\n```\n%s\n```\n' "$*" "$(printf '%s\n' "$out" | tail -n 40)" >> "$RUNNER_TEMP/results.md"
              failed=true
            fi
          }
          failed=false
          : > "$RUNNER_TEMP/results.md"
          run go get "$MODULE@$LATEST"
          # Without the new version in go.mod, the steps below would only retest the pinned one.
          if [ "$failed" = "false" ]; then
            run go mod tidy
            run go build ./...
            run go vet ./...
            run go test ./tools/nsgo/...
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.versions.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
          FAILED: ${{ steps.trial.outputs.failed }}
        run: |
          if [ "$FAILED" = "true" ]; then
            verdict="The trial upgrade **failed**. Check the errors below before upgrading; if the signing adapter's tests fail, NSGo changed the code \`tools/nsgo\` patches."
          else
            verdict="The trial upgrade built, vetted and passed the signing adapter's tests. Native UI tests were not run."
          fi
          {
            echo "NSGo's main branch has moved past the version this project pins."
            echo
            echo "| | Version |"
            echo "| --- | --- |"
            echo "| Pinned | \`$CURRENT\` |"
            echo "| NSGo main | \`$LATEST\` |"
            echo
            echo "Changes: https://github.com/nsgo-dev/nsgo/compare/${CURRENT##*-}...${LATEST##*-}"
            echo
            echo "$verdict"
            echo
            cat "$RUNNER_TEMP/results.md"
            echo
            echo "To upgrade locally:"
            echo
            echo '```sh'
            echo "go get $MODULE@$LATEST && go mod tidy"
            echo "make test && make test-native"
            echo '```'
            echo
            echo "Then run \`make dev\` once to check that development builds are still signed."
            echo
            echo "_Updated by the NSGo update check on $(date -u +%Y-%m-%d)._"
          } > "$RUNNER_TEMP/body.md"

          number="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated issue #$number"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
