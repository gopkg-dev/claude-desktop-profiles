name: Release

# Pushing a tag such as v0.7.0 builds the installer and Sparkle appcast and publishes them
# as a GitHub release. Installed copies read the latest release's appcast, so they are
# offered the update as soon as this finishes.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes are read from this version's release commit.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n 's/^version:[[:space:]]*//p' nsgo.yaml | tr -d '"')"
          code="$(sed -n 's/^const applicationVersion = "\(.*\)"/\1/p' main.go)"
          echo "tag $tag, nsgo.yaml $manifest, main.go $code"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$code" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in nsgo.yaml ($manifest) and main.go ($code)."
            exit 1
          fi

      - name: Test
        run: go test ./...

      # Signed ad hoc: no certificate is needed, and the signature carries no developer name
      # or email. Updates are verified by Sparkle's EdDSA signature instead.
      - name: Build
        env:
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
        run: |
          if [ -z "$NSGO_UPDATES_KEY" ]; then
            echo "::error::Set the NSGO_UPDATES_KEY secret; see README."
            exit 1
          fi
          go tool nsgo build -target macos_arm64 -sign -
          ls -l dist/releases
          ls dist/releases/appcast-*.xml > /dev/null

      # The "- " lines of this version's "chore(release): X.Y.Z" commit become the notes
      # Sparkle's update dialog shows.
      - name: Add release notes
        run: |
          git log -1 --format=%b --fixed-strings --grep "chore(release): ${GITHUB_REF_NAME#v}" "$GITHUB_REF_NAME" |
            python3 -I .github/scripts/release_notes.py --markdown "$RUNNER_TEMP/notes.md" dist/releases/appcast-*.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/releases/* \
            --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --latest \
            --title "Claude Desktop Profiles ${GITHUB_REF_NAME#v}"
