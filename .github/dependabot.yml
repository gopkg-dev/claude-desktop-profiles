version: 2
updates:
  # Keep the workflow actions current. Go modules are left alone: NSGo is pinned on purpose.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    # One pull request for all action updates, so they never conflict with each other.
    groups:
      actions:
        patterns: ["*"]
